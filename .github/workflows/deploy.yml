name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm run build` shells out to Python: build_site_data.py assembles the
      # data bundle and generate_og_images.py renders the link previews.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      - run: npm ci
        working-directory: site

      # BASE_PATH makes the build work under https://<user>.github.io/<repo>/.
      # SITE_URL must be ABSOLUTE: Open Graph crawlers do not resolve relative
      # og:image paths, so a root-relative one silently fails to unfurl.
      # Both default sensibly for a custom domain — set BASE_PATH to "/" and
      # SITE_URL to the domain root.
      # The owner is lowercased because Pages hostnames are canonically lower
      # case. Mixed case resolves, but crawlers cache Open Graph data by exact
      # URL, so the canonical form avoids duplicate or missed previews.
      - name: Resolve deployed origin
        id: origin
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "url=https://${owner}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: ${{ steps.origin.outputs.url }}

      # GitHub Pages serves a 404 for unknown paths; copying index.html to
      # 404.html makes client-side routes deep-linkable and shareable, which the
      # comparison URLs depend on.
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
