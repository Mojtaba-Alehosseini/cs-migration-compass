name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The weekly refresh's commit CANNOT trigger this on its own. GitHub
  # deliberately does not start workflows from a push made with the default
  # GITHUB_TOKEN, to stop a job triggering itself forever — so "Refresh postings
  # panel" pushed b5d3abb, 21 files of fresh data, and nothing deployed. The
  # data was in the repo and the live site went on serving 16 August's, which is
  # the exact symptom packages 17 and 18 exist to fix, arriving one step past
  # where anyone was looking.
  #
  # workflow_run is the supported way to chain: it fires on the OTHER workflow
  # completing, regardless of who pushed. The job below guards on its
  # conclusion, because a refresh that failed must not publish anything.
  workflow_run:
    workflows: ["Refresh postings panel"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A refresh that failed must not publish. On a push or a manual dispatch
    # there is no workflow_run context, so this is true and the behaviour is
    # unchanged.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    # The Worker the built site calls, named once so the vault probe below
    # asks the same Worker the bundle will talk to.
    env:
      CV_WORKER_URL: https://cs-compass-cv.bigbookarchive.workers.dev
    steps:
      # workflow_run checks out the default branch's HEAD, which is what the
      # refresh just pushed — exactly the commit that needs publishing.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm run build` shells out to Python: build_site_data.py assembles the
      # data bundle and generate_og_images.py renders the link previews.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      - run: npm ci
        working-directory: site

      # BASE_PATH makes the build work under https://<user>.github.io/<repo>/.
      # SITE_URL must be ABSOLUTE: Open Graph crawlers do not resolve relative
      # og:image paths, so a root-relative one silently fails to unfurl.
      # Both default sensibly for a custom domain — set BASE_PATH to "/" and
      # SITE_URL to the domain root.
      # The owner is lowercased because Pages hostnames are canonically lower
      # case. Mixed case resolves, but crawlers cache Open Graph data by exact
      # URL, so the canonical form avoids duplicate or missed previews.
      - name: Resolve deployed origin
        id: origin
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "url=https://${owner}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

      # Package 47 — the site must never offer to keep a profile the Worker
      # cannot keep. A plain GET /profile with no Origin header, which cannot
      # create or read anything: the vault refuses it (origin_forbidden)
      # before its rate limiter or storage, and a Worker without the vault
      # answers 404. See scripts/probe_vault.mjs. Any other answer, an error
      # or a timeout leaves the flag OFF — the step never fails the deploy.
      #
      # The Worker is deployed by hand (from worker/: npx wrangler deploy).
      # This workflow has workflow_dispatch, so once that is done, re-running
      # it (Actions -> Deploy to GitHub Pages -> Run workflow) turns the vault
      # on with no code change. The step says so in the run's own log.
      - name: Probe the CV Worker for the vault
        id: vault
        run: |
          state=$(node scripts/probe_vault.mjs "$CV_WORKER_URL") || state=off
          [ "$state" = "on" ] || state=off
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$state" = "on" ]; then
            echo "::notice title=CV vault ON::$CV_WORKER_URL has the vault route; this build offers to keep a profile."
            echo "CV vault: **on** — the Worker at $CV_WORKER_URL has /profile." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=CV vault OFF::No vault at $CV_WORKER_URL/profile, so this build offers no consent and no saved profile. Once the Worker is deployed, re-run this workflow by hand (Actions -> Deploy to GitHub Pages -> Run workflow); no code change is needed."
            echo "CV vault: **off** — no /profile route at $CV_WORKER_URL (or the probe could not tell). After deploying the Worker, re-run this workflow by hand." >> "$GITHUB_STEP_SUMMARY"
          fi

      # VITE_TURNSTILE_SITE_KEY is a Turnstile SITE key, not a secret by
      # design — Turnstile's own model is that this value is embedded in
      # every page that renders the widget, unlike TURNSTILE_SECRET_KEY
      # (server-side only, held by the Worker alone, never here).
      # VITE_CV_WORKER_URL is likewise just the Worker's own public
      # endpoint, already named in index.html's own CSP connect-src.
      # VITE_CV_VAULT is the probe's answer: only "on" turns storage on.
      - name: Build
        run: npm run build
        working-directory: site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: ${{ steps.origin.outputs.url }}
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEf1kzX0YZ-SBayy
          VITE_CV_WORKER_URL: ${{ env.CV_WORKER_URL }}
          VITE_CV_VAULT: ${{ steps.vault.outputs.state }}

      # GitHub Pages serves a 404 for unknown paths; copying index.html to
      # 404.html makes client-side routes deep-linkable and shareable, which the
      # comparison URLs depend on.
      - name: SPA fallback
        run: cp site/dist/index.html site/dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
