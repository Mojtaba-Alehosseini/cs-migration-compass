name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-data:
    name: Validate data + provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      # Runs against the COMMITTED data. It does not hit the network, so a
      # third-party outage can never turn the build red.
      - name: Validate
        run: python scripts/validate_data.py

      # Package 13, Tier 1 — structural invariants validate_data.py doesn't
      # already cover (percentile monotonicity, magnitude plausibility,
      # unit disclosure, ...). Same network-free contract as Validate above.
      - name: Audit
        run: python scripts/audit_data.py

      # Package 13, Tier 0 — regression tests for past data/arithmetic bugs
      # (docs/REGRESSION-CATALOGUE.md). Python half only: the client-side
      # half (scripts/tests/test_ui_regressions.mjs) needs a served
      # production build and a real browser, which this job doesn't have —
      # see that file's own header.
      - name: Regression tests (Python)
        run: python -m unittest discover -s scripts/tests -p "test_*.py" -v

  build-site:
    name: Type-check + build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not 20 -- test_ui_regressions.mjs's own cdp.mjs uses Node's
          # global WebSocket (stable since Node 22; Node 20 does not have
          # it at all), the only thing its CDP driver needs beyond stdlib.
          # Found live: Node 20 failed with ReferenceError: WebSocket is
          # not defined the first time this suite actually ran in CI.
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm run build` invokes the Python data-bundle and OG-image generators.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      - run: npm ci
        working-directory: site

      - run: npm run typecheck
        working-directory: site

      # Package 14 — the site's first real unit-test suite (site/tests/),
      # added after an adversarial review caught a function's code comment
      # FALSELY claiming "unit-tested" with no test actually wired anywhere
      # (finding M6). Node's own --test runner, no new devDependency.
      - run: npm test
        working-directory: site

      # Same non-secret values deploy.yml's own build step uses — a
      # Turnstile SITE key and the Worker's own public URL, neither
      # confidential (see deploy.yml's own comment) — so the UI regression
      # suite below exercises the CV panel in its real, configured state.
      - run: npm run build
        working-directory: site
        env:
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAAEf1kzX0YZ-SBayy
          VITE_CV_WORKER_URL: https://cs-compass-cv.bigbookarchive.workers.dev

      # Package 13, Tier 0/5 gate 12 — the 9 client-side regressions in
      # docs/REGRESSION-CATALOGUE.md (R1, R2, R3, R8, R9, R10, R11, R12,
      # R13) live only in compiled TypeScript; adversarial review finding
      # M12: more than half the catalogue ran only when a human remembered
      # to start a preview server by hand. ubuntu-latest ships Chrome, so
      # this job already has everything test_ui_regressions.mjs needs —
      # start the build's own preview server, wait for it, run the suite
      # against it, then stop the server either way.
      - name: UI regression suite
        working-directory: site
        run: |
          npm run preview -- --port 4173 &
          PREVIEW_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          CHROME_PATH=google-chrome-stable node ../scripts/tests/test_ui_regressions.mjs
          TEST_EXIT=$?
          # Package 25 — the figure inventory's own six assertions, run against
          # the SAME preview server. They render every route and entity the
          # site can show (100 combinations, ~585 figures) and assert over what
          # the DOM actually contains: no figure sitting on an unset
          # initialiser, no "no data" over non-empty data, no internal key
          # visible, every card naming a real source, nothing clipped below
          # legibility without a tap target, every mark clearing its contrast
          # floor against what is really painted behind it. Package 24 shipped
          # two of those defects to production; both were invisible in review
          # and obvious on screen. Runs here rather than in a script someone
          # has to remember.
          if [ $TEST_EXIT -eq 0 ]; then
            CHROME_PATH=google-chrome-stable node ../scripts/tests/test_figure_inventory.mjs
            TEST_EXIT=$?
          fi
          kill $PREVIEW_PID 2>/dev/null || true
          exit $TEST_EXIT

      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7

  pipeline-smoke:
    name: Pipeline smoke test (network)
    runs-on: ubuntu-latest
    # Third-party endpoints go down; that is their problem, not a broken repo.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Run two cheap sources end to end
        run: python scripts/pipeline.py world_bank eurostat_ict
