name: Refresh postings panel

# Package 12, tier 2 — postings go stale in days, unlike the statistics the
# rest of this pipeline is built on, so this runs far more often than the
# wage spine's own (manual, work-order-triggered) refresh. Weekly, not
# daily: each harvester's own MAX_NEW_PER_RUN cap already bounds a single
# run's work (see scripts/src_postings_*.py), and the raw-response cache
# under data/raw/postings/ is cleared past a week old so a run actually
# re-checks postings that might have closed, not just grows the seed list
# — daily would mean paying that same re-fetch cost seven times a week for
# a "stale in days, not hours" source. Fails soft, per source: one provider
# timing out (Lever's own reads are documented as slow under load) does not
# lose the others' data — see continue-on-error below.

on:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC — off the hour, avoiding the
      # documented top-of-hour pile-up on GitHub's own scheduler
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-run postings harvesters
    runs-on: ubuntu-latest
    # Package 14, adversarial review L3 -- no explicit timeout meant this job
    # relied entirely on GitHub's own 360-minute default. build_probe_order()'s
    # own "reclaim" bucket (postings_common.py) probes every already-verified
    # company UNCONDITIONALLY every run, uncapped, and only grows as more
    # companies get verified over time -- today that is real but small
    # (~8-12 CPU-minutes of throttled requests at current company counts, not
    # remotely close to 360), so this is a safety net against future,
    # currently-unbounded growth or a genuinely stalled run, not a response
    # to an active problem. See NEEDS-DECISION #41 for the growth question
    # itself, which this timeout does not answer on its own.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install pipeline dependencies
        run: python -m pip install -r scripts/requirements.txt

      # Cached raw responses older than a week are dropped BEFORE the run,
      # not after — a harvester whose own cache-check sees an existing file
      # skips it regardless of age (scripts/_common.py's own fetch()), so
      # "stale in days" only holds if this step actually runs first.
      - name: Drop postings raw-cache entries older than 7 days
        run: find data/raw/postings -type f -mtime +7 -delete 2>/dev/null || true

      # Each step is independent and soft-fails — a down or slow provider
      # (Lever's own reads are documented as slow under real load) costs
      # that one provider's data for this run, never the other five.
      - name: Ashby
        run: python scripts/src_postings_ashby.py
        continue-on-error: true

      - name: Greenhouse
        run: python scripts/src_postings_greenhouse.py
        continue-on-error: true

      - name: Lever
        run: python scripts/src_postings_lever.py
        continue-on-error: true

      - name: Teamtailor
        run: python scripts/src_postings_teamtailor.py
        continue-on-error: true

      - name: USAJOBS
        run: python scripts/src_postings_usajobs.py
        continue-on-error: true

      - name: Hacker News "Who is hiring?"
        run: python scripts/src_postings_hn.py
        continue-on-error: true

      - name: Merge into postings.json
        run: python scripts/build_postings.py

      - name: Classify occupations (Gemini, titles only — skips cleanly if GEMINI_API_KEY is unset)
        run: python scripts/classify_postings.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true

      # Package 17 — these three ran only ever on a laptop, and that was the
      # defect. Package 15 built the title classifier and the de-duplicator;
      # package 16 joined their output into postings.json and taught
      # validate_data.py to REQUIRE that join. The join was never added here, so
      # the first scheduled run after package 16 landed (2026-08-24) harvested
      # 48,724 postings, wrote none of their title_class or duplicate_of, and
      # was correctly blocked by Validate below — permanently, since nothing in
      # this workflow could ever satisfy the check. The refresh had silently
      # stopped being able to ship.
      #
      # No continue-on-error, for the same reason Validate and Audit have none:
      # all three are deterministic, offline and free (TF-IDF + a linear model,
      # seed 15 — no API key, no network), so a failure here is a real bug, not
      # a slow provider. Letting one pass silently would put us back to a build
      # that cannot pass its own validator.
      - name: Classify titles (offline, seeded — package 15's TF-IDF model)
        run: python scripts/classify_titles.py

      - name: De-duplicate postings
        run: python scripts/dedupe_postings.py

      - name: Join classes + clusters into postings.json, derive per-country pay
        run: python scripts/apply_postings_annotations.py

      - name: Rebuild site data bundle
        run: python scripts/build_site_data.py

      # Package 13, Tier 4 — this workflow pushes to main UNATTENDED; these
      # two steps have no continue-on-error, so a broken invariant stops the
      # job here and the commit below never runs. Deliberately stricter than
      # the harvester steps above (a slow provider costs its own data, which
      # is recoverable next Monday; committing a value validate_data.py or
      # audit_data.py can already prove is wrong is not something a human
      # reviews before it ships, since nothing here waits for one).
      - name: Validate (blocks the commit below on failure)
        run: python scripts/validate_data.py

      - name: Audit (blocks the commit below on failure)
        run: python scripts/audit_data.py

      # Package 13, Tier 3 — a drift snapshot of THIS run, compared against
      # last week's. validate/audit above check the data is internally
      # well-formed; this catches the shape validate/audit cannot by
      # construction — a harvester silently truncating its own output
      # (e.g. one continue-on-error step above swallowing a real failure
      # partway through) still produces well-formed, individually-valid
      # records, just far fewer of them. A genuine drop (not ordinary
      # week-to-week growth) fails this step too, adversarial review
      # finding M6 — an earlier version of this workflow had no drift gate
      # at all on the one path that pushes to main unattended.
      - name: Snapshot drift (blocks the commit below on a real drop)
        run: python scripts/snapshot_stats.py

      # history/openings.json is the 144 KB per-country summary /work renders;
      # history/postings.json is the full list /openings renders. build_site_data.py
      # writes both from the same array on every run, so they agree by
      # construction — but only if both are COMMITTED. Committing one and not
      # the other is how the two pages come to show different counts for the
      # same country, which is the exact disagreement package 17 shipped the
      # classifier's own `sw` flag to prevent.
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/postings*.json data/provenance.json data/raw/postings_seed_hints \
            data/quality_history \
            site/public/data/history/postings.json site/public/data/history-manifest.json \
            site/public/data/history/openings.json \
            site/public/data/provenance.json
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "Weekly postings refresh (automated, github-actions[bot])"
          git push
